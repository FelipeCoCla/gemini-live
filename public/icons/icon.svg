<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181e29" />
      <stop offset="80%" stop-color="#0d0f12" />
      <stop offset="100%" stop-color="#080a0c" />
    </radialGradient>

    <!-- Outer Bloom Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Siri / Gemini Gradient -->
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <radialGradient id="orbGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0d0f12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Neon Halo -->
  <circle cx="256" cy="256" r="160" fill="url(#orbGrad1)" opacity="0.35" filter="url(#glow)" />

  <!-- Fluid Glowing Inner Sphere -->
  <circle cx="256" cy="256" r="130" fill="url(#orbGrad1)" />

  <!-- Glass Light Reflection -->
  <circle cx="256" cy="256" r="130" fill="url(#orbGrad2)" />

  <!-- Center Shimmer Waves -->
  <path d="M190 256 Q 220 220, 256 256 T 322 256" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
